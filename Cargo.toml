[workspace]
resolver = "2"
members = [
    "crates/*"
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
returns = { path = "crates/returns" }
stats = { path = "crates/stats" }

arrow = { version = "60.2.0", features = ["ffi"] }
statrs = "0.19.1"
polars = "0.55.2"
polars-arrow = "0.55.2"
pyo3 = { version = "0.29", features = ["abi3-py311"]}
pyo3-polars = { version = "0.28", features = ["derive", "dtype-full"]}
rand = "0.10.4"
